name: Air Quality MLOps Pipeline

on:
  schedule:
    # Ingesta cada hora en el minuto 5
    - cron: '5 * * * *'
    # Reentrenamiento diario a las 03:15 UTC
    - cron: '15 3 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic desde GitHub

jobs:
  ingest-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar worker de ingesta (Open-Meteo + OpenAQ -> Neon)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python worker.py

      - name: Reentrenar modelo de pronóstico 84h->12h
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 3 * * *'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python train_forecast_model.py